name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22.12.0]
    env:
      JLC_TEST_BROWSER: chromium
      # Ubuntu hosted runners restrict Chromium user namespaces. This applies
      # only to synthetic browser fixtures, never the production default.
      JLC_CHROME_NO_SANDBOX: ${{ matrix.os == 'ubuntu-latest' && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: node dist/cli.js --help
      - run: npm pack --dry-run --ignore-scripts
